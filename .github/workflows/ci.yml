name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    # The Go version comes from go.mod, so the module and CI never disagree.
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: './go.mod'
        check-latest: true
    - run: go version

    - name: Format
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -count=1 ./...
